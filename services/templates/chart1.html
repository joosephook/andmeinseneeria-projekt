<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <title>Kaalutud keskmine võlapäevade arv</title>

    <!-- Kui CDN ei tööta sisevõrgus, kasuta lokaalselt: <script src="echarts.min.js"></script> -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
    <link rel="stylesheet" href="/static/style.css">

</head>
<body>

<div class="site-header">
    <div class="top-bar">
        <img src="/static/logo.png" class="site-logo"> 
        <div class="site-title">Projektitöö: "Võlapäevade trendid"</div>
    </div>

    <div id="errorBox" class="error"></div>
    <div class="main-menu">
      <a class="tablinks" href="/chart1">Kaalutud keskmine võlapäevade arv</a>
      <a class="tablinks" href="/chart2">Võlas ettevõtete ja lepingute arv</a>
      <a class="tablinks" href="/overdues_report">Kaalutud keskmiste võlapäevade aruanne</a>
    </div>
</div>

<main class="page-content">
<h1>Kaalutud keskmine võlapäevade arv</h1>
<div class="chart-container">
    <div id="chart"></div>
</div>
</main>

<script>
    const chartElement = document.getElementById('chart');
    const chart = echarts.init(chartElement);

    fetch('/overdues_summary')
        .then(response => {
            if (!response.ok) {
                throw new Error('API päring ebaõnnestus. HTTP staatus: ' + response.status);
            }
            return response.json();
        })
        .then(data => {
            const dates = data.map(row => row.report_date);
            const weightedAvgDebtDays = data.map(row => row.weighted_avg_debtdays);

            const option = {
                title: {
                    text: 'Kaalutud keskmine võlapäevade arv ajas',
                    left: 'center'
                },
                tooltip: {
                    trigger: 'axis',
                    valueFormatter: function (value) {
                        if (value === null || value === undefined) {
                            return '';
                        }
                        return Number(value).toLocaleString('et-EE') + ' päeva';
                    }
                },
                grid: {
                    left: 60,
                    right: 30,
                    top: 80,
                    bottom: 90
                },
                dataZoom: [
                    {
                        type: 'slider',
                        start: 0,
                        end: 100
                    },
                    {
                        type: 'inside'
                    }
                ],
                xAxis: {
                    type: 'category',
                    data: dates,
                    name: 'Kuupäev',
                    nameLocation: 'middle',
                    nameGap: 65,
					nameTextStyle: {
						fontSize: 16,
						fontWeight: 'bold'
					},
					axisLabel: {
					rotate: 45,
					fontSize: 16
					}
                },
				yAxis: {
					type: 'value',
					name: 'Võlapäevad',
					min: 500,
					nameGap: 35,
					nameTextStyle: {
						fontSize: 16,
						fontWeight: 'bold'
					},
					axisLabel: {
					fontSize: 16,
					formatter: '{value}'
						}
					},
                series: [
                    {
                        name: 'Kaalutud keskmine võlapäevade arv',
                        type: 'line',
                        data: weightedAvgDebtDays,
                        smooth: true,
                        symbol: 'circle',
                        symbolSize: 7
                    }
                ]
            };

            chart.setOption(option);
        })
        .catch(error => {
            const errorBox = document.getElementById('errorBox');
            errorBox.style.display = 'block';
            errorBox.textContent = 'Andmete laadimine ebaõnnestus: ' + error.message;
            console.error(error);
        });

    window.addEventListener('resize', function () {
        chart.resize();
    });
</script>

</body>
</html>
