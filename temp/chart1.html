<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <title>Kaalutud keskmine võlapäevade arv</title>

    <!-- Kui CDN ei tööta sisevõrgus, kasuta lokaalselt: <script src="echarts.min.js"></script> -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background: #f7f7f7;
        }

        h1 {
            color: #24513f;
            margin-bottom: 20px;
        }

        .chart-container {
            background: #ffffff;
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 20px;
        }

        #chart {
            width: 100%;
            height: 500px;
        }

        .error {
            display: none;
            color: #b00020;
            background: #ffecec;
            border: 1px solid #ffb3b3;
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

<h1>Kaalutud keskmine võlapäevade arv</h1>

<div id="errorBox" class="error"></div>

<div class="chart-container">
    <div id="chart"></div>
</div>

<script>
    const chartElement = document.getElementById('chart');
    const chart = echarts.init(chartElement);

    fetch('api_weighted_avg_debtdays.php')
        .then(response => {
            if (!response.ok) {
                throw new Error('API päring ebaõnnestus. HTTP staatus: ' + response.status);
            }
            return response.json();
        })
        .then(data => {
            const dates = data.map(row => row.report_date);
            const weightedAvgDebtDays = data.map(row => row.weighted_avg_debtdays);

            const option = {
                title: {
                    text: 'Kaalutud keskmine võlapäevade arv ajas',
                    left: 'center'
                },
                tooltip: {
                    trigger: 'axis',
                    valueFormatter: function (value) {
                        if (value === null || value === undefined) {
                            return '';
                        }
                        return Number(value).toLocaleString('et-EE') + ' päeva';
                    }
                },
                grid: {
                    left: 60,
                    right: 30,
                    top: 80,
                    bottom: 90
                },
                dataZoom: [
                    {
                        type: 'slider',
                        start: 0,
                        end: 100
                    },
                    {
                        type: 'inside'
                    }
                ],
                xAxis: {
                    type: 'category',
                    data: dates,
                    name: 'Kuupäev',
                    nameLocation: 'middle',
                    nameGap: 65,
					nameTextStyle: {
						fontSize: 16,
						fontWeight: 'bold'
					},
					axisLabel: {
					rotate: 45,
					fontSize: 16
					}
                },
				yAxis: {
					type: 'value',
					name: 'Võlapäevad',
					min: 500,
					nameGap: 35,
					nameTextStyle: {
						fontSize: 16,
						fontWeight: 'bold'
					},
					axisLabel: {
					fontSize: 16,
					formatter: '{value}'
						}
					},
                series: [
                    {
                        name: 'Kaalutud keskmine võlapäevade arv',
                        type: 'line',
                        data: weightedAvgDebtDays,
                        smooth: true,
                        symbol: 'circle',
                        symbolSize: 7
                    }
                ]
            };

            chart.setOption(option);
        })
        .catch(error => {
            const errorBox = document.getElementById('errorBox');
            errorBox.style.display = 'block';
            errorBox.textContent = 'Andmete laadimine ebaõnnestus: ' + error.message;
            console.error(error);
        });

    window.addEventListener('resize', function () {
        chart.resize();
    });
</script>

</body>
</html>
